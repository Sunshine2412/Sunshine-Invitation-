<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Admin — Raka & Alya</title><style>body{margin:0;background:#f4eee7;color:#2b241f;font:14px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #ddd0c2;padding:22px;margin:14px 0}h1{font:500 48px Georgia;margin:10px 0}input,button{padding:12px;border:1px solid #cdbca9;background:#fff}button{background:#2b241f;color:#fff;cursor:pointer}.top{display:flex;gap:10px;flex-wrap:wrap}.stat{display:inline-block;padding:15px 22px;border:1px solid #ddd0c2;margin:4px;background:#faf7f2}.stat b{display:block;font-size:25px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}@media(max-width:650px){table{font-size:10px}.hide-sm{display:none}}</style></head><body><main class="wrap"><div class="card"><div>PRIVATE ADMIN</div><h1>Raka &amp; Alya</h1><p>Dashboard RSVP lokal. Untuk data lintas perangkat, isi endpoint Google Sheets pada <b>CONFIG.googleSheetsEndpoint</b> di index.html.</p><div id="login"><input id="pin" type="password" placeholder="PIN admin"><button id="enter">Masuk</button></div></div><div id="app" hidden><div class="card"><div class="stat"><b id="total">0</b>Total RSVP</div><div class="stat"><b id="yes">0</b>Hadir</div><div class="stat"><b id="no">0</b>Tidak hadir</div><div class="stat"><b id="maybe">0</b>Ragu</div><div class="top"><button id="export">Export CSV</button><button id="clear">Hapus data lokal</button></div></div><div class="card"><table><thead><tr><th>Nama</th><th>Kehadiran</th><th>Tamu</th><th>Ucapan</th><th>Waktu</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const pin='2026',data=()=>JSON.parse(localStorage.getItem('wedding_rsvp')||'[]');function render(){const d=data();total.textContent=d.length;yes.textContent=d.filter(x=>x.attendance==='Hadir').length;no.textContent=d.filter(x=>x.attendance==='Tidak Hadir').length;maybe.textContent=d.filter(x=>x.attendance==='Masih Ragu').length;rows.innerHTML=d.slice().reverse().map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.attendance)}</td><td>${esc(x.guests)}</td><td>${esc(x.message||'-')}</td><td>${new Date(x.time).toLocaleString('id-ID')}</td></tr>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}enter.onclick=()=>{if(pin.value===pin){login.hidden=true;app.hidden=false;render()}else alert('PIN salah')};export.onclick=()=>{const d=data();const csv=['Nama,Kehadiran,Tamu,Pesan,Waktu',...d.map(x=>[x.name,x.attendance,x.guests,x.message,x.time].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='rsvp-raka-alya.csv';a.click()};clear.onclick=()=>{if(confirm('Hapus semua RSVP lokal?')){localStorage.removeItem('wedding_rsvp');render()}};</script></body></html>
